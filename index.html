<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lords at War</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" data-i18n-aria="hud.battlefield"></canvas>

  <header id="topbar">
    <dl>
      <div class="food"><dt data-i18n="resource.food"></dt><dd id="res-food">0</dd></div>
      <div class="wood"><dt data-i18n="resource.wood"></dt><dd id="res-wood">0</dd></div>
      <div class="gold"><dt data-i18n="resource.gold"></dt><dd id="res-gold">0</dd></div>
      <div class="stone"><dt data-i18n="resource.stone"></dt><dd id="res-stone">0</dd></div>
      <div class="pop"><dt data-i18n="hud.population"></dt><dd id="res-pop">0 / 0</dd></div>
    </dl>
    <span id="clock">0:00</span>
    <span id="age"><span class="prefix" data-i18n="hud.age"></span> <b id="age-name"></b></span>
    <span id="difficulty"><span class="prefix" data-i18n="hud.difficulty"></span> <b id="difficulty-name"></b></span>
    <nav>
      <button type="button" id="btn-pause"></button>
      <button type="button" id="btn-sound"></button>
      <button type="button" id="btn-help" data-i18n="hud.help"></button>
      <button type="button" id="btn-restart" data-i18n="hud.restart"></button>
      <button type="button" id="btn-lang" class="lang" data-i18n="lang.switch" data-i18n-aria="lang.label"></button>
    </nav>
  </header>

  <canvas id="minimap" data-i18n-title="hud.minimapTitle" data-i18n-aria="hud.minimap"></canvas>
  <button type="button" id="btn-idle" data-i18n-title="hud.idleTitle">
    <span data-i18n="hud.idle"></span> <b id="idle-count">0</b> <kbd>.</kbd>
  </button>
  <button type="button" id="btn-alert" data-i18n-title="hud.alertTitle" hidden>
    <span data-i18n="hud.alert"></span> <kbd>⏎</kbd>
  </button>
  <div id="civ-badge" hidden></div>
  <div id="hint" aria-live="polite"></div>
  <div id="toast" role="status"></div>
  <div id="tooltip" role="tooltip" hidden></div>

  <footer id="panel">
    <section id="selection">
      <h2 id="sel-title"></h2>
      <p id="sel-body"></p>
    </section>
    <section id="production">
      <div id="queue"></div>
      <p id="queue-note"></p>
    </section>
    <section id="command">
      <p id="sel-rally"></p>
      <div id="actions" role="group" data-i18n-aria="hud.commands"></div>
    </section>
  </footer>

  <div id="overlay" hidden>
    <div class="dialog" role="dialog" aria-labelledby="overlay-title">
      <button type="button" id="overlay-lang" class="lang" data-i18n="lang.switch" data-i18n-aria="lang.label"></button>
      <h1 id="overlay-title"></h1>
      <p id="overlay-note"></p>
      <section id="achievements" hidden>
        <h2 data-i18n="achievement.title"></h2>
        <ul id="achievement-list"></ul>
      </section>
      <div id="help-text">
        <p data-i18n="help.intro"></p>
        <table>
          <tbody>
            <tr><th data-i18n="help.selectKeys"></th><td data-i18n="help.selectText"></td></tr>
            <tr><th data-i18n="help.orderKeys"></th><td data-i18n="help.orderText"></td></tr>
            <tr><th data-i18n="help.scrollKeys"></th><td data-i18n="help.scrollText"></td></tr>
            <tr><th data-i18n="help.groupKeys"></th><td data-i18n="help.groupText"></td></tr>
          </tbody>
        </table>
        <p data-i18n="help.tip"></p>
      </div>
      <fieldset id="civ-picker">
        <legend data-i18n="civ.legend"></legend>
      </fieldset>
      <fieldset id="difficulty-picker">
        <legend data-i18n="difficulty.legend"></legend>
      </fieldset>
      <div class="buttons">
        <button type="button" id="overlay-primary"></button>
        <button type="button" id="overlay-restart" data-i18n="button.restart"></button>
        <button type="button" id="overlay-cancel" data-i18n="button.back"></button>
      </div>
    </div>
  </div>

  <script src="js/namespace.js"></script>
  <script src="js/data.js"></script>
  <script src="js/i18n/zh-TW.js"></script>
  <script src="js/i18n/en.js"></script>
  <script src="js/i18n/i18n.js"></script>
  <script src="js/sim/map.js"></script>
  <script src="js/sim/pathfind.js"></script>
  <script src="js/sim/world.js"></script>
  <script src="js/sim/civs.js"></script>
  <script src="js/sim/mapgen.js"></script>
  <script src="js/sim/movement.js"></script>
  <script src="js/sim/gather.js"></script>
  <script src="js/sim/fish.js"></script>
  <script src="js/sim/construction.js"></script>
  <script src="js/sim/repair.js"></script>
  <script src="js/sim/garrison.js"></script>
  <script src="js/sim/rally.js"></script>
  <script src="js/sim/wander.js"></script>
  <script src="js/sim/fog.js"></script>
  <script src="js/sim/animals.js"></script>
  <script src="js/sim/production.js"></script>
  <script src="js/sim/research.js"></script>
  <script src="js/sim/farm.js"></script>
  <script src="js/sim/market.js"></script>
  <script src="js/sim/pen.js"></script>
  <script src="js/sim/achievements.js"></script>
  <script src="js/sim/alerts.js"></script>
  <script src="js/sim/formation.js"></script>
  <script src="js/sim/combat.js"></script>
  <script src="js/sim/towers.js"></script>
  <script src="js/sim/heal.js"></script>
  <script src="js/sim/orders.js"></script>
  <script src="js/sim/commands.js"></script>
  <script src="js/sim/game.js"></script>
  <script src="js/ai/economy.js"></script>
  <script src="js/ai/camps.js"></script>
  <script src="js/ai/age.js"></script>
  <script src="js/ai/tech.js"></script>
  <script src="js/ai/care.js"></script>
  <script src="js/ai/hunt.js"></script>
  <script src="js/ai/scout.js"></script>
  <script src="js/ai/expand.js"></script>
  <script src="js/ai/counter.js"></script>
  <script src="js/ai/ai.js"></script>
  <script src="js/view/camera.js"></script>
  <script src="js/view/groups.js"></script>
  <script src="js/view/depth.js"></script>
  <script src="js/view/minimap.js"></script>
  <script src="js/view/sprites.js"></script>
  <script src="js/view/sprites-civ.js"></script>
  <script src="js/view/sprites-buildings.js"></script>
  <script src="js/view/sprites-animals.js"></script>
  <script src="js/view/scenery.js"></script>
  <script src="js/view/ground.js"></script>
  <script src="js/view/fishing.js"></script>
  <script src="js/view/render.js"></script>
  <script src="js/view/alert.js"></script>
  <script src="js/view/upgrade-info.js"></script>
  <script src="js/view/actions.js"></script>
  <script src="js/view/tooltip.js"></script>
  <script src="js/view/civ-picker.js"></script>
  <script src="js/view/sound-events.js"></script>
  <script src="js/view/sound.js"></script>
  <script src="js/view/hud.js"></script>
  <script src="js/view/input.js"></script>
  <script src="js/view/cursor.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
